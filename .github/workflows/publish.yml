name: publish

# A GitHub release vX.Y.Z publishes that version to PyPI with trusted
# publishing: no token stored anywhere. One-time setup on pypi.org:
# Publishing -> Add a pending publisher (owner adecubed, repo topicscout,
# workflow publish.yml, environment pypi).
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: tag matches the version in pyproject.toml
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v$v" || { echo "tag ${GITHUB_REF_NAME} but pyproject says $v"; exit 1; }
      - run: pip install ".[mcp]" pytest build
      - run: pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
